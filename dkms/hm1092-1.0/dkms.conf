PACKAGE_NAME="hm1092"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="hm1092"
DEST_MODULE_LOCATION[0]="/extra"
AUTOINSTALL="yes"
# Build with the SAME compiler as the target kernel. This file is sourced by
# dkms as shell, and $kernelver is the kernel being built for -- so decide here
# rather than making the installer rewrite this file afterwards. That matters
# because AUTOINSTALL=yes rebuilds on kernel upgrades with no installer involved,
# and because a machine can have both a clang kernel and a gcc kernel installed.
#
# clang refuses gcc's flags (-mpreferred-stack-boundary, -mindirect-branch=...),
# so a mismatch is not a warning, it is a build that fails with the reason buried
# in a log nobody reads.
if [ -f "/lib/modules/${kernelver}/build/.config" ] &&
   grep -q '^CONFIG_CC_IS_CLANG=y' "/lib/modules/${kernelver}/build/.config" 2>/dev/null; then
  _CC_FLAGS="CC=clang LD=ld.lld LLVM=1"
else
  _CC_FLAGS=""
fi

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build ${_CC_FLAGS} modules"

# IPU7 + Synaptics SVP7500 + intel_cvs + sensors take ~6-8 seconds to fully
# come up at boot. Default WirePlumber libcamera discovery timeout is 1000ms,
# which fires before the cameras finish initializing — result: empty Video
# Devices in wpctl, even though `cam --list` from CLI works fine.
#
# Override to 15 seconds. Adds at most ~14s to wireplumber startup if cameras
# never appear; saves us the rebuild loop.

wireplumber.settings = {
  monitor.camera-discovery-timeout = 15000
}

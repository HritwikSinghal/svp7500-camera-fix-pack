# Make libcamera camera nodes release the camera when idle.
# Without this, PipeWire's libcamera plugin keeps /dev/video0 open
# continuously, which makes intel_ipu7_isys.isys_suspend() return
# -EBUSY (it checks isys->stream_opened) and blocks s2idle suspend.
#
# With node.pause-on-idle=true, when no client is consuming the camera,
# PipeWire releases the device and isys can suspend cleanly.

monitor.libcamera.rules = [
  {
    matches = [
      { device.api = "libcamera" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = true
      }
    }
  }
]

name: package selftest

# Validate the package the way a STRANGER receives it, not the way it looks in
# a maintainer's working tree.
#
# The bug this guards against shipped green: install.sh searched kernel/<name>/
# for modules the package publishes as dkms/<name>-<version>/, skipped all four,
# and still exited 0. It worked on nobody's machine, including the author's --
# because the author never ran the installer, they had the modules already.
#
# So this runs on a fresh checkout with nothing installed, and again on the
# archive git actually produces, where only committed and tracked content
# exists. A file that lives solely in someone's working directory fails here.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-checkout:
    name: selftest on a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tools/selftest.sh
        run: ./tools/selftest.sh

      # A check nobody has watched fail is not yet a check. --prove builds a
      # throwaway package carrying the exact layout mismatch that shipped and
      # asserts selftest rejects it -- and builds a correct one to prove it is
      # not simply failing everything.
      - name: prove the module check still fires
        run: ./tools/selftest.sh --prove

  release-archive:
    name: selftest on the archive users download
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `git archive` produces the same content as GitHub's source tarball:
      # tracked files only, with their recorded modes. Anything untracked, or
      # executable only in a local working tree, disappears here -- which is
      # precisely how "it works for me" becomes "it did nothing for you".
      - name: unpack the tarball a user would get
        run: |
          mkdir -p /tmp/asif
          git archive --format=tar HEAD | tar -x -C /tmp/asif
          echo "--- what a user receives ---"
          find /tmp/asif -maxdepth 2 -name '*.sh' -printf '%M %p\n' | sort

      - name: tools/selftest.sh (unpacked archive)
        working-directory: /tmp/asif
        run: ./tools/selftest.sh

      # The archive is also where a symlink stops being a symlink if the
      # packaging ever changes: verify.sh is one file under two names, and the
      # duplicate check only stays meaningful if it still fires here.
      - name: prove the checks still fire in the archive
        working-directory: /tmp/asif
        run: ./tools/selftest.sh --prove

      - name: install.sh --help must work from the archive
        working-directory: /tmp/asif
        run: ./install.sh --help

  refuses-wrong-hardware:
    name: the tools must refuse a machine that is not a candidate
    runs-on: ubuntu-latest
    # A CI runner is the perfect stranger's-laptop: no IPU7, no CVS bridge, no
    # camera of any kind. Every tool here must SAY SO and exit non-zero. The
    # whole point of this package's rewrite is that a run which achieved nothing
    # never reports success, and this is the only job that exercises install.sh
    # past --help, so the dry-run path cannot quietly rot.
    steps:
      - uses: actions/checkout@v4

      - name: install the toolchain so hardware is the ONLY thing missing
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dkms kmod patch clang lld llvm

      - name: check-hardware.sh must say no
        run: |
          set +e
          out=$(./tools/check-hardware.sh); rc=$?
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "FAIL: check-hardware.sh accepted a runner with no IPU7"; exit 1; }
          grep -q 'APPLIES TO THIS MACHINE: no' <<<"$out" \
            || { echo "FAIL: no verdict line naming this machine as unsupported"; exit 1; }

      - name: install.sh --dry-run must refuse, with exit 2 and a reason
        run: |
          set +e
          out=$(sudo ./install.sh --dry-run 2>&1); rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 2 ] || { echo "FAIL: expected preflight refusal (exit 2), got $rc"; exit 1; }
          grep -q 'no supported board found' <<<"$out" \
            || { echo "FAIL: refused without naming the hardware as the reason"; exit 1; }
          grep -q 'nothing was changed' <<<"${out,,}" \
            || { echo "FAIL: did not state that nothing was changed"; exit 1; }

      - name: install.sh must never print Done on a run that installed nothing
        run: |
          set +e
          out=$(sudo ./install.sh --dry-run 2>&1)
          grep -q '==> Done' <<<"$out" \
            && { echo "FAIL: printed Done on a machine where it refused to run"; exit 1; }
          exit 0

      - name: verify.sh must never report OK with no camera present
        run: |
          set +e
          out=$(sudo ./tools/verify.sh 2>&1); rc=$?
          printf '%s\n' "$out"
          grep -q 'RESULT: OK' <<<"$out" \
            && { echo "FAIL: verify.sh reported OK on a machine with no camera"; exit 1; }
          [ "$rc" -ne 0 ] || { echo "FAIL: verify.sh exited 0 with no camera"; exit 1; }
          grep -qE 'RESULT: (BROKEN|UNDETERMINED)' <<<"$out" \
            || { echo "FAIL: verify.sh printed no verdict at all"; exit 1; }

      - name: find-ir-node.sh must refuse to guess
        run: |
          set +e
          out=$(./tools/find-ir-node.sh 2>&1); rc=$?
          printf '%s\n' "$out"
          [ "$rc" -ne 0 ] || { echo "FAIL: find-ir-node.sh exited 0 with no media device"; exit 1; }
          grep -qiE 'GUESS' <<<"$out" \
            && { echo "FAIL: find-ir-node.sh guessed a value"; exit 1; }
          exit 0
